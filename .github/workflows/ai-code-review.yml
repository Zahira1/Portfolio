name: AI Code Review (Gemini)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─── Step 1: Get the diff ──────────────────────────────────────────────
  get-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          else
            git diff HEAD~1 HEAD > diff.txt
          fi
          head -c 8000 diff.txt > trimmed_diff.txt

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: diff
          path: trimmed_diff.txt
          retention-days: 1

  # ─── Step 2: Review with Gemini ─────────────────────────────────────────
  review-gemini:
    needs: get-diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download diff
        uses: actions/download-artifact@v4
        with:
          name: diff

      - name: Review with Gemini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.error, sys

          github_token = os.environ["GITHUB_TOKEN"]
          gemini_api_key = os.environ["GEMINI_API_KEY"]
          model = os.environ["GEMINI_MODEL"]
          repo = os.environ["REPO"]
          commit_sha = os.environ["COMMIT_SHA"]
          pr_number = os.environ.get("PR_NUMBER", "")

          with open("trimmed_diff.txt", "r", errors="replace") as f:
              diff = f.read()

          if not diff.strip():
              print("No diff found, skipping.")
              sys.exit(0)

          truncated_note = ""
          try:
              full_size = os.path.getsize("diff.txt") if os.path.exists("diff.txt") else len(diff)
          except OSError:
              full_size = len(diff)
          if full_size > 8000:
              truncated_note = "\n\n[NOTE: This diff was truncated to 8000 characters. It may be incomplete — do not assume the shown portion is the full change.]\n"

          PROMPT = """You are a senior code reviewer. Review this git diff and provide:
          1. **Summary** — what changed and why it matters
          2. **Bugs / issues** — anything that could break or misbehave
          3. **Security concerns** — hardcoded secrets, injection risks, auth gaps
          4. **Suggestions** — improvements, readability, naming, tests
          5. **Verdict** — one of: ✅ Approve | ⚠️ Approve with suggestions | ❌ Request Changes

          Be specific. Cite line numbers where relevant. Format in markdown.
          """ + truncated_note + """
          Diff:
          """ + diff

          payload = json.dumps({
              "contents": [
                  {"parts": [{"text": PROMPT}]}
              ]
          }).encode("utf-8")

          req = urllib.request.Request(
              f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": gemini_api_key,
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  raw = res.read()
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  print("Gemini returned a non-JSON response (first 1000 chars):")
                  print(raw.decode(errors="replace")[:1000])
                  sys.exit(1)
              try:
                  review = data["candidates"][0]["content"]["parts"][0]["text"]
              except (KeyError, IndexError, TypeError):
                  print("Unexpected response shape from Gemini:")
                  print(json.dumps(data, indent=2)[:1000])
                  sys.exit(1)
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              print("Gemini API error:", e.code, body)
              sys.exit(1)
          except urllib.error.URLError as e:
              print("Gemini network error:", e.reason)
              sys.exit(1)

          comment = "## Gemini Code Review\n\n" + review
          comment_payload = json.dumps({"body": comment}).encode("utf-8")

          if pr_number:
              url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
          else:
              url = f"https://api.github.com/repos/{repo}/commits/{commit_sha}/comments"

          req2 = urllib.request.Request(
              url,
              data=comment_payload,
              headers={"Authorization": f"Bearer {github_token}", "Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req2):
              print("Gemini review comment posted.")
          EOF
