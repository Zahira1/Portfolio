name: AI Code Review (TAMU AI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─── Step 1: Get the diff ──────────────────────────────────────────────
  get-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          else
            git diff HEAD~1 HEAD > diff.txt
          fi
          head -c 8000 diff.txt > trimmed_diff.txt

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: diff
          path: trimmed_diff.txt
          retention-days: 1

  # ─── Step 2: Review with TAMU AI (OpenAI-compatible API) ───────────────
  review-tamu-ai:
    needs: get-diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download diff
        uses: actions/download-artifact@v4
        with:
          name: diff

      - name: Review with TAMU AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAMU_AI_API_KEY: ${{ secrets.TAMU_AI_API_KEY }}
          # This is an Open WebUI instance (confirmed via the account settings
          # UI). Base URL is the site root, confirmed from the browser
          # address bar: https://chat.tfs.tamus.ai
          TAMU_AI_BASE_URL: ${{ vars.TAMU_AI_BASE_URL || 'https://chat.tfs.tamus.ai' }}
          # Confirmed available in your account's model dropdown.
          TAMU_AI_MODEL: ${{ vars.TAMU_AI_MODEL || 'gpt-4.1' }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.error, sys

          github_token = os.environ["GITHUB_TOKEN"]
          tamu_api_key = os.environ["TAMU_AI_API_KEY"]
          base_url = os.environ["TAMU_AI_BASE_URL"].rstrip("/")
          model = os.environ["TAMU_AI_MODEL"]
          repo = os.environ["REPO"]
          commit_sha = os.environ["COMMIT_SHA"]
          pr_number = os.environ.get("PR_NUMBER", "")

          with open("trimmed_diff.txt", "r", errors="replace") as f:
              diff = f.read()

          if not diff.strip():
              print("No diff found, skipping.")
              sys.exit(0)

          truncated_note = ""
          try:
              full_size = os.path.getsize("diff.txt") if os.path.exists("diff.txt") else len(diff)
          except OSError:
              full_size = len(diff)
          if full_size > 8000:
              truncated_note = "\n\n[NOTE: This diff was truncated to 8000 characters. It may be incomplete — do not assume the shown portion is the full change.]\n"

          PROMPT = """You are a senior code reviewer. Review this git diff and provide:
          1. **Summary** — what changed and why it matters
          2. **Bugs / issues** — anything that could break or misbehave
          3. **Security concerns** — hardcoded secrets, injection risks, auth gaps
          4. **Suggestions** — improvements, readability, naming, tests
          5. **Verdict** — one of: ✅ Approve | ⚠️ Approve with suggestions | ❌ Request Changes

          Be specific. Cite line numbers where relevant. Format in markdown.
          """ + truncated_note + """
          Diff:
          """ + diff

          payload = json.dumps({
              "model": model,
              "stream": False,
              "messages": [
                  {"role": "system", "content": "You are a senior software engineer doing a code review."},
                  {"role": "user", "content": PROMPT}
              ]
          }).encode("utf-8")

          # Open WebUI's native chat completions endpoint (not /openai/...)
          req = urllib.request.Request(
              f"{base_url}/api/chat/completions",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {tamu_api_key}",
                  # Cloudflare (fronting TAMU AI) blocks the default
                  # "Python-urllib/3.x" UA with error 1010. Use a normal UA.
                  "User-Agent": "Mozilla/5.0 (compatible; GitHubActions-CodeReview/1.0)",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  raw = res.read()
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  print("TAMU AI returned a non-JSON response (first 1000 chars):")
                  print(raw.decode(errors="replace")[:1000])
                  sys.exit(1)
              try:
                  review = data["choices"][0]["message"]["content"]
              except (KeyError, IndexError, TypeError):
                  print("Unexpected response shape from TAMU AI:")
                  print(json.dumps(data, indent=2)[:1000])
                  sys.exit(1)
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              print("TAMU AI API error:", e.code, body)
              if e.code == 403 and "1010" in body:
                  print("This is a Cloudflare block (error 1010), not an API auth failure.")
                  print("Check that TAMU_AI_BASE_URL is correct and that GitHub Actions runners")
                  print("aren't being blocked outright by TAMU's WAF (may require an IP allowlist")
                  print("exception or a different API gateway for programmatic/CI access).")
              sys.exit(1)
          except urllib.error.URLError as e:
              print("TAMU AI network error:", e.reason)
              sys.exit(1)

          comment = "## TAMU AI Review\n\n" + review
          comment_payload = json.dumps({"body": comment}).encode("utf-8")

          if pr_number:
              url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
          else:
              url = f"https://api.github.com/repos/{repo}/commits/{commit_sha}/comments"

          req2 = urllib.request.Request(
              url,
              data=comment_payload,
              headers={"Authorization": f"Bearer {github_token}", "Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req2):
              print("TAMU AI review comment posted.")
          EOF
